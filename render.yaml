services:
  - type: web
    name: quizkz-live
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: quizkz-data
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATA_DIR
        value: /data
      - key: AUTH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
