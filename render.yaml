services:
  - type: web
    name: quizkz-live
    runtime: docker
    # Тегін тариф: диск жоқ, деректер қайта іске қосылғанда жойылады.
    # Ақылыға көшу: plan: starter және төмендегі disk бөлімін қосу.
    plan: free
    healthCheckPath: /healthz
    # disk:
    #   name: quizkz-data
    #   mountPath: /data
    #   sizeGB: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATA_DIR
        value: /data
      - key: AUTH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
